# Separate blind audit. Do not replace the frozen Sol baseline or change training rows.
[decisions]
provider = "openrouter"
model = "openai/gpt-6-luna-decisions"
base_url = "https://openrouter.ai/api/alpha"
timeout_seconds = 60
max_retries = 1
# Arka truncates state above this limit. The caller must reject overflow before calling it.
max_state_chars = 100000
# Starting policy only. These probabilities are not measured human agreement rates.
accept_at = 0.95
reject_at = 0.20
