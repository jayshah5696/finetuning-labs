# Synthetic teacher data. The existing validation bundle never enters author prompts.
[author]
backend = "openrouter_responses_via_arka"
model = "openai/gpt-6-luna"
reasoning_effort = "none"
max_output_tokens = 16384

# Keep the same semantic rubric and model settings as the diagnostic baseline.
[judge]
backend = "openrouter_responses_via_arka"
model = "openai/gpt-6.1-sol"
reasoning_effort = "high"
max_output_tokens = 16384
