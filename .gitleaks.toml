title = "finetuning-labs gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Allow SHA-256 digests, git revisions, and OpenAI encrypted reasoning blobs in rewriter manifests, reviews, and raw model call records"
paths = [
  '''^data/rewriter/.*/manifest\.json$''',
  '''^data/rewriter/.*/raw-call-manifest\.json$''',
  '''^data/rewriter/reviews/sol-english-delivery-review\.json$''',
  '''^data/rewriter/evals/lora-validation-20261028/sol-setup-review\.json$''',
  '''^data/rewriter/evals/.*/calls/.*\.json$''',
  '''^data/rewriter/.*/sol-calls/.*\.json$''',
]
regexTarget = "line"
regexes = [
  '''"gAAAAAB[A-Za-z0-9_-]+"''',
  '''"[0-9a-f]{40}"''',
  '''"[0-9a-f]{64}"''',
]
