[project]
name = "finetuning-labs"
version = "0.1.0"
description = "Small fine-tuning experiments, starting with a rewriter benchmark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
finetuning-labs = "finetuning_labs.rewriter.benchmark:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
data = ["transformers==5.21.0", "datasets==5.1.0", "jinja2>=3.1.0"]
hosted = ["arka", "openai==2.54.0"]
remote = ["modal>=1.0"]
training = ["peft==0.21.2", "accelerate==1.15.0", "wandb==0.31.0"]

[tool.uv.sources]
arka = { git = "https://github.com/jayshah5696/arka.git", rev = "5d353740ae1dd34742841071752814028db1489a" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["data/rewriter/personal/**", "artifacts/**", ".venv/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/finetuning_labs"]

[tool.hatch.build.targets.wheel.force-include]
"data/rewriter/benchmark-draft" = "finetuning_labs/data/rewriter/benchmark-draft"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
