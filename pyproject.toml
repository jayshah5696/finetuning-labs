[project]
name = "finetuning-labs"
version = "0.1.0"
description = "Fine-tune and evaluate small English text-rewriter models with LoRA"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "data/rewriter/PUBLIC_DATA_LICENSE.md"]
authors = [{ name = "Jay Shah" }]
requires-python = ">=3.12"
keywords = [
    "fine-tuning",
    "lora",
    "peft",
    "liquid-ai",
    "lfm",
    "text-rewriting",
    "dictation",
    "llm-evaluation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jayshah5696/finetuning-labs"
Repository = "https://github.com/jayshah5696/finetuning-labs"
Issues = "https://github.com/jayshah5696/finetuning-labs/issues"
Datasets = "https://huggingface.co/datasets/jayshah5696/finetuning-labs-rewriter-training"

[project.scripts]
finetuning-labs = "finetuning_labs.rewriter.benchmark:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
data = ["transformers==5.21.0", "datasets==5.1.0", "jinja2>=3.1.0"]
hosted = ["arka", "openai==2.54.0"]
remote = ["modal>=1.0"]
training = ["peft==0.21.2", "accelerate==1.15.0", "wandb==0.31.0"]

[tool.uv.sources]
arka = { git = "https://github.com/jayshah5696/arka.git", rev = "5d353740ae1dd34742841071752814028db1489a" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["data/rewriter/personal/**", "artifacts/**", ".venv/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/finetuning_labs"]

[tool.hatch.build.targets.wheel.force-include]
"data/rewriter/benchmark-draft" = "finetuning_labs/data/rewriter/benchmark-draft"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
