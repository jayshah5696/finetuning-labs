  temperature: 0.6
  max_tokens: 8000
  llm_override: null
dedup:
- type: exact
filters:
  target_count: 60
  stages:
  - type: length
    min_instruction_chars: 1
    max_instruction_chars: 24000
    min_response_chars: 1
    max_response_chars: 24000
  - type: decision_panel
    include:
    - labeling_engine
    decision_override: null
  - decision_override: null
    accept_at: 0.85
    reject_at: 0.2
    on_uncertain: escalate
    min_confidence: 0.2
    backend: decision
    type: labeling_engine
    rubric_path: rubric.yaml
    min_overall_score: 0.8
